<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tank Battle - Online Multiplayer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%; overflow: hidden; touch-action: none;
            -webkit-user-select: none; user-select: none;
        }
        body { display: flex; flex-direction: column; align-items: center; }
        h1 {
            margin: 8px 0 4px; font-size: clamp(1.2rem, 5vw, 1.9rem);
            color: #00ff88; text-shadow: 0 0 12px #00ff88; flex-shrink: 0;
        }
        #menu {
            display: flex; flex-direction: column; align-items: center;
            gap: 14px; margin-top: 30px; max-width: 400px; width: 90%; padding: 0 10px;
        }
        .btn {
            background: linear-gradient(135deg, #00c853, #00a844); color: #fff;
            border: none; padding: 14px 24px; font-size: 1.05rem; border-radius: 12px;
            cursor: pointer; width: 100%; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3); -webkit-appearance: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn.secondary { background: linear-gradient(135deg, #2196f3, #1976d2); }
        .btn.danger { background: linear-gradient(135deg, #f44336, #d32f2f); }
        .btn:disabled { opacity: 0.55; cursor: default; }
        input[type="text"] {
            width: 100%; padding: 14px 16px; font-size: 1.15rem; border-radius: 10px;
            border: 2px solid #333; background: #16213e; color: #fff;
            text-align: center; letter-spacing: 3px; text-transform: uppercase;
            -webkit-appearance: none;
        }
        input[type="text"]:focus { outline: none; border-color: #00ff88; }
        .status { font-size: 0.95rem; color: #aaa; text-align: center; min-height: 22px; }
        .status.error { color: #ff5252; }
        .status.success { color: #00ff88; }
        #gameUI {
            display: none; width: 100%; height: 100%; flex-direction: column;
            align-items: center; position: relative; overflow: hidden;
        }
        .info {
            display: flex; gap: 8px; margin: 4px 0; font-size: clamp(0.7rem, 2.8vw, 0.9rem);
            flex-wrap: wrap; justify-content: center; flex-shrink: 0; padding: 0 8px;
        }
        .player-info { padding: 4px 8px; border-radius: 6px; background: #16213e; }
        .p0 { border: 2px solid #00aaff; }
        .p1 { border: 2px solid #ff4444; }
        .p2 { border: 2px solid #44ff88; }
        .p3 { border: 2px solid #ffaa00; }
        .canvas-wrap {
            position: relative; flex: 1; width: 100%; display: flex;
            justify-content: center; align-items: center; min-height: 0; overflow: hidden;
        }
        canvas {
            border: 2px solid #0f3460; border-radius: 6px; background: #0f0f1a;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.12);
            display: block; max-width: 100%; max-height: 100%; touch-action: none;
        }
        .controls {
            margin-top: 4px; display: flex; gap: 12px; font-size: 0.8rem; color: #aaa;
            flex-wrap: wrap; justify-content: center; flex-shrink: 0; padding: 0 8px 4px;
        }
        .controls div { background: #16213e; padding: 6px 12px; border-radius: 6px; }
        .controls strong { color: #00ff88; }
        .message {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: clamp(1.3rem, 5.5vw, 2.1rem); font-weight: bold; color: #fff;
            text-shadow: 0 0 20px #00ff88; pointer-events: none; opacity: 0;
            transition: opacity 0.3s; z-index: 30; text-align: center; padding: 0 12px;
        }
        .message.show { opacity: 1; }
        .room-box {
            background: #16213e; padding: 14px 20px; border-radius: 12px;
            border: 2px solid #00ff88; text-align: center; margin: 8px 0; width: 100%;
        }
        .room-code {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 5px;
            color: #00ff88; margin: 6px 0;
        }
        .hint { font-size: 0.8rem; color: #888; margin-top: 4px; }
        #disconnectBtn { display: none; margin: 6px 0; max-width: 200px; padding: 10px; font-size: 0.95rem; }

        #touchControls {
            display: none; position: absolute; inset: 0; pointer-events: none; z-index: 15;
        }
        #touchControls.active { display: block; }
        .joystick-zone {
            position: absolute; bottom: 18px; left: 16px;
            width: 130px; height: 130px; pointer-events: auto;
        }
        .joystick-base {
            width: 130px; height: 130px; border-radius: 50%;
            background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.22);
            position: relative; touch-action: none;
        }
        .joystick-stick {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(0, 255, 136, 0.55); border: 2px solid rgba(0, 255, 136, 0.9);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .joystick-stick.active { background: rgba(0, 255, 136, 0.85); }
        .shoot-btn {
            position: absolute; bottom: 28px; right: 20px; width: 88px; height: 88px;
            border-radius: 50%; background: rgba(255, 60, 60, 0.45);
            border: 3px solid rgba(255, 80, 80, 0.9); color: #fff; font-size: 0.95rem;
            font-weight: bold; display: flex; align-items: center; justify-content: center;
            pointer-events: auto; touch-action: none; user-select: none;
            box-shadow: 0 0 18px rgba(255, 50, 50, 0.35);
        }
        .shoot-btn:active, .shoot-btn.pressed {
            background: rgba(255, 40, 40, 0.8); transform: scale(0.92);
        }
        .mobile-only-hint {
            display: none; font-size: 0.75rem; color: #777; text-align: center; margin-top: 2px;
        }
        @media (max-height: 500px) and (orientation: landscape) {
            h1 { font-size: 1rem; margin: 2px 0; }
            .info { font-size: 0.65rem; gap: 6px; margin: 2px 0; }
            .joystick-zone { width: 110px; height: 110px; bottom: 10px; left: 10px; }
            .joystick-base { width: 110px; height: 110px; }
            .joystick-stick { width: 46px; height: 46px; }
            .shoot-btn { width: 70px; height: 70px; bottom: 14px; right: 14px; font-size: 0.8rem; }
            .controls { display: none; }
            #disconnectBtn { padding: 6px 12px; font-size: 0.8rem; margin: 2px 0; }
        }
        @media (max-width: 600px) {
            .controls { display: none; }
            .mobile-only-hint { display: block; }
            #restartHint { display: none; }
        }
    </style>
</head>
<body>
    <h1>Tank Battle</h1>

    <div id="menu">
        <button class="btn" id="btnPractice">Practice vs Bots</button>
        <button class="btn secondary" id="btnLocal">Local 2-Player (Same Keyboard)</button>
        <button class="btn secondary" id="btnHost">Host Online Game (up to 4)</button>
        <button class="btn secondary" id="btnJoin">Join Online Game</button>

        <div id="practicePanel" style="display:none; width:100%;">
            <div class="hint" style="margin-bottom:8px; text-align:center;">How many bots?</div>
            <button class="btn" id="btnBots1">1 Bot</button>
            <button class="btn" id="btnBots2" style="margin-top:8px;">2 Bots</button>
            <button class="btn" id="btnBots3" style="margin-top:8px;">3 Bots</button>
            <button class="btn danger" id="btnCancelPractice" style="margin-top:12px;">Cancel</button>
        </div>

        <div id="hostPanel" style="display:none; width:100%;">
            <div class="room-box">
                <div>Room Code</div>
                <div class="room-code" id="roomCodeDisplay">----</div>
                <div class="hint">Share code or link — game starts at 2 players</div>
            </div>
            <button class="btn secondary" id="btnShareLink" style="margin-top:4px;">Copy Share Link</button>
            <div class="status" id="shareStatus" style="margin-top:6px;"></div>
            <div class="status" id="hostStatus">Waiting for players...</div>
            <div class="status" id="playerCountStatus">Players: 1 / 4</div>
            <button class="btn danger" id="btnCancelHost" style="margin-top:12px;">Cancel</button>
        </div>

        <div id="joinPanel" style="display:none; width:100%;">
            <input type="text" id="joinCode" placeholder="ENTER ROOM CODE" maxlength="6" autocomplete="off" inputmode="text">
            <button class="btn" id="btnDoJoin" style="margin-top:10px;">Join Game</button>
            <div class="status" id="joinStatus"></div>
            <button class="btn danger" id="btnCancelJoin" style="margin-top:12px;">Cancel</button>
        </div>
    </div>

    <div id="gameUI">
        <div class="info" id="scoreBoard">
            <div class="player-info p0" id="scoreBox0">P1: <span id="score0">0</span></div>
            <div class="player-info p1" id="scoreBox1">P2: <span id="score1">0</span></div>
            <div class="player-info p2" id="scoreBox2" style="display:none;">P3: <span id="score2">0</span></div>
            <div class="player-info p3" id="scoreBox3" style="display:none;">P4: <span id="score3">0</span></div>
            <div class="player-info" id="roundLabel" style="border:2px solid #00ff88;">Round 1 / 3</div>
            <div class="player-info" id="modeLabel" style="border:2px solid #666;">Local</div>
        </div>
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <div class="message" id="message"></div>
            <div id="matchOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.72); z-index:25; flex-direction:column; align-items:center; justify-content:center; gap:16px; pointer-events:auto;">
                <div id="matchResultText" style="font-size:clamp(1.3rem,5.5vw,2.1rem); font-weight:bold; color:#fff; text-shadow:0 0 20px #00ff88; text-align:center; padding:0 16px;"></div>
                <div style="font-size:0.95rem; color:#aaa;" id="matchScoreText"></div>
                <div id="matchStatsText" style="font-size:0.85rem; color:#ccc; text-align:left; max-width:340px; line-height:1.55; background:rgba(0,0,0,0.35); padding:12px 16px; border-radius:10px;"></div>
                <button class="btn" id="btnPlayAgain" style="max-width:260px;">Play Again</button>
                <button class="btn danger" id="btnMatchMenu" style="max-width:260px;">Back to Menu</button>
            </div>
            <div id="touchControls">
                <div class="joystick-zone" id="joystickZone">
                    <div class="joystick-base" id="joystickBase">
                        <div class="joystick-stick" id="joystickStick"></div>
                    </div>
                </div>
                <div class="shoot-btn" id="shootBtn">FIRE</div>
            </div>
        </div>
        <div class="controls" id="controlsInfo"></div>
        <p class="hint" id="restartHint">Best of 3 — last tank standing wins the round</p>
        <p class="mobile-only-hint">Joystick = move & turn &nbsp;|&nbsp; FIRE = shoot</p>
        <button class="btn danger" id="disconnectBtn">Leave Game</button>
    </div>

    <script>
        const TANK_SIZE = 28, BULLET_SPEED = 7, TANK_SPEED = 2.8, ROT_SPEED = 0.055;
        const FIRE_COOLDOWN = 400, BOT_FIRE_COOLDOWN = 1200, BULLET_RADIUS = 4, WALL_THICKNESS = 20, TICK_RATE = 1000 / 30;
        const MAX_PLAYERS = 4;
        const PLAYER_COLORS = ['#00aaff', '#ff4444', '#44ff88', '#ffaa00'];
        const PLAYER_NAMES = ['P1 Blue', 'P2 Red', 'P3 Green', 'P4 Orange'];
        const SPAWNS = [
            { x: 100, y: 120 }, { x: 700, y: 120 },
            { x: 100, y: 380 }, { x: 700, y: 380 }
        ];
        // Destructible wall grid (cell-based so shots can punch holes)
        const CELL = 25;
        const COLS = 32; // 800 / 25
        const ROWS = 20; // 500 / 25
        const BORDER = 1; // solid border cells
        let wallGrid = []; // wallGrid[row][col] = true if solid

        function clearSpawnAreas() {
            for (const s of SPAWNS) {
                const cx = Math.floor(s.x / CELL);
                const cy = Math.floor(s.y / CELL);
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        const c = cx + dx, r = cy + dy;
                        if (r > BORDER - 1 && r < ROWS - BORDER && c > BORDER - 1 && c < COLS - BORDER) {
                            if (wallGrid[r] && wallGrid[r][c] !== undefined) wallGrid[r][c] = false;
                        }
                    }
                }
            }
        }

        function generateWalls() {
            wallGrid = [];
            for (let r = 0; r < ROWS; r++) {
                wallGrid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    const isBorder = r < BORDER || r >= ROWS - BORDER || c < BORDER || c >= COLS - BORDER;
                    wallGrid[r][c] = isBorder;
                }
            }

            // Random pillars / blocks
            const pillars = 6 + Math.floor(Math.random() * 6);
            for (let i = 0; i < pillars; i++) {
                const w = 1 + Math.floor(Math.random() * 3);
                const h = 1 + Math.floor(Math.random() * 4);
                const c0 = BORDER + 2 + Math.floor(Math.random() * (COLS - BORDER * 2 - w - 4));
                const r0 = BORDER + 2 + Math.floor(Math.random() * (ROWS - BORDER * 2 - h - 4));
                for (let r = r0; r < r0 + h; r++)
                    for (let c = c0; c < c0 + w; c++)
                        if (r < ROWS - BORDER && c < COLS - BORDER) wallGrid[r][c] = true;
            }

            // Random horizontal bars
            const hBars = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < hBars; i++) {
                const len = 3 + Math.floor(Math.random() * 6);
                const c0 = BORDER + 2 + Math.floor(Math.random() * (COLS - BORDER * 2 - len - 2));
                const r0 = BORDER + 2 + Math.floor(Math.random() * (ROWS - BORDER * 2 - 2));
                for (let c = c0; c < c0 + len; c++) wallGrid[r0][c] = true;
            }

            // Random vertical bars
            const vBars = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < vBars; i++) {
                const len = 3 + Math.floor(Math.random() * 5);
                const r0 = BORDER + 2 + Math.floor(Math.random() * (ROWS - BORDER * 2 - len - 2));
                const c0 = BORDER + 2 + Math.floor(Math.random() * (COLS - BORDER * 2 - 2));
                for (let r = r0; r < r0 + len; r++) wallGrid[r][c0] = true;
            }

            // Occasional L-shapes
            const elbows = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < elbows; i++) {
                const c0 = BORDER + 3 + Math.floor(Math.random() * (COLS - 10));
                const r0 = BORDER + 3 + Math.floor(Math.random() * (ROWS - 10));
                const len = 2 + Math.floor(Math.random() * 3);
                for (let k = 0; k < len; k++) {
                    wallGrid[r0][c0 + k] = true;
                    wallGrid[r0 + k][c0] = true;
                }
            }

            clearSpawnAreas();
        }

        function packWallGrid() {
            const out = [];
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c < COLS; c++)
                    out.push(wallGrid[r][c] ? 1 : 0);
            return out;
        }

        function unpackWallGrid(arr) {
            if (!arr || arr.length !== ROWS * COLS) return;
            wallGrid = [];
            let i = 0;
            for (let r = 0; r < ROWS; r++) {
                wallGrid[r] = [];
                for (let c = 0; c < COLS; c++) wallGrid[r][c] = !!arr[i++];
            }
        }

        function circleHitsWall(x, y, radius) {
            const minC = Math.max(0, Math.floor((x - radius) / CELL));
            const maxC = Math.min(COLS - 1, Math.floor((x + radius) / CELL));
            const minR = Math.max(0, Math.floor((y - radius) / CELL));
            const maxR = Math.min(ROWS - 1, Math.floor((y + radius) / CELL));
            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    if (!wallGrid[r] || !wallGrid[r][c]) continue;
                    // Closest point on cell to circle center
                    const cx = Math.max(c * CELL, Math.min(x, (c + 1) * CELL));
                    const cy = Math.max(r * CELL, Math.min(y, (r + 1) * CELL));
                    if ((cx - x) * (cx - x) + (cy - y) * (cy - y) < radius * radius) return true;
                }
            }
            return false;
        }

        // Punch a hole in destructible (non-border) walls. Returns true if anything was destroyed.
        function destroyWallAt(x, y, holeRadius) {
            const minC = Math.max(0, Math.floor((x - holeRadius) / CELL));
            const maxC = Math.min(COLS - 1, Math.floor((x + holeRadius) / CELL));
            const minR = Math.max(0, Math.floor((y - holeRadius) / CELL));
            const maxR = Math.min(ROWS - 1, Math.floor((y + holeRadius) / CELL));
            let hit = false;
            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    if (!wallGrid[r] || !wallGrid[r][c]) continue;
                    // Never destroy outer border
                    if (r < BORDER || r >= ROWS - BORDER || c < BORDER || c >= COLS - BORDER) {
                        hit = true; // still counts as a wall hit
                        continue;
                    }
                    const cx = c * CELL + CELL / 2;
                    const cy = r * CELL + CELL / 2;
                    if (Math.hypot(cx - x, cy - y) <= holeRadius + CELL * 0.35) {
                        wallGrid[r][c] = false;
                        hit = true;
                    }
                }
            }
            return hit;
        }

        // Initial layout
        generateWalls();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageEl = document.getElementById('message');
        const modeLabel = document.getElementById('modeLabel');
        const controlsInfo = document.getElementById('controlsInfo');
        const restartHint = document.getElementById('restartHint');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const touchControls = document.getElementById('touchControls');

        let scores = [0, 0, 0, 0];
        let shotsFired = [0, 0, 0, 0];
        let hitsLanded = [0, 0, 0, 0];
        let gameOver = false, matchOver = false, currentRound = 1;
        let roundTransitionTimer = null;
        let mode = null; // 'local' | 'host' | 'client'
        let peer = null;
        let mySlot = 0;
        let gameStarted = false;
        let lastNetworkSend = 0;
        let localKeys = {};
        let touchInput = { up: false, down: false, left: false, right: false, shoot: false };
        let isTouchDevice = false;

        // Online: host keeps slots + connections
        // slots[i] = { active, peerId, conn, inputs, tank }
        let slots = [];
        let clientConn = null; // client -> host connection
        let pendingSfx = []; // network: host queues sounds for clients

        // ==================== SOUND EFFECTS (Web Audio) ====================
        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        // Unlock audio on first tap/key (mobile browsers)
        function unlockAudio() {
            const ctx = ensureAudio();
            if (!ctx) return;
            const b = ctx.createBuffer(1, 1, 22050);
            const s = ctx.createBufferSource();
            s.buffer = b;
            s.connect(ctx.destination);
            s.start(0);
        }
        ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
            window.addEventListener(ev, function once() {
                unlockAudio();
                window.removeEventListener(ev, once, true);
            }, true);
        });

        function queueSfx(name) {
            pendingSfx.push(name);
        }

        function playPew() {
            const ctx = ensureAudio();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, t0);
            osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.09);
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.11);
            queueSfx('pew');
        }

        function playExplosion() {
            const ctx = ensureAudio();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            // Noise burst
            const duration = 0.45;
            const frames = Math.floor(ctx.sampleRate * duration);
            const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < frames; i++) {
                const env = Math.pow(1 - i / frames, 2.2);
                data[i] = (Math.random() * 2 - 1) * env;
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(1200, t0);
            noiseFilter.frequency.exponentialRampToValueAtTime(180, t0 + 0.35);
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.35, t0);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noise.start(t0);
            // Low boom
            const osc = ctx.createOscillator();
            const og = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, t0);
            osc.frequency.exponentialRampToValueAtTime(35, t0 + 0.4);
            og.gain.setValueAtTime(0.0001, t0);
            og.gain.exponentialRampToValueAtTime(0.45, t0 + 0.01);
            og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
            osc.connect(og);
            og.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.45);
            queueSfx('boom');
        }

        function playSfxList(list) {
            if (!list || !list.length) return;
            for (const name of list) {
                if (name === 'pew') playPewSilent();
                else if (name === 'boom') playExplosionSilent();
            }
        }
        // Silent variants for clients (don't re-queue to network)
        function playPewSilent() {
            const ctx = ensureAudio();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, t0);
            osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.09);
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.11);
        }
        function playExplosionSilent() {
            const ctx = ensureAudio();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const duration = 0.45;
            const frames = Math.floor(ctx.sampleRate * duration);
            const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < frames; i++) {
                const env = Math.pow(1 - i / frames, 2.2);
                data[i] = (Math.random() * 2 - 1) * env;
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(1200, t0);
            noiseFilter.frequency.exponentialRampToValueAtTime(180, t0 + 0.35);
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.35, t0);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noise.start(t0);
            const osc = ctx.createOscillator();
            const og = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, t0);
            osc.frequency.exponentialRampToValueAtTime(35, t0 + 0.4);
            og.gain.setValueAtTime(0.0001, t0);
            og.gain.exponentialRampToValueAtTime(0.45, t0 + 0.01);
            og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
            osc.connect(og);
            og.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.45);
        }

        class Tank {
            constructor(slot) {
                const s = SPAWNS[slot];
                this.slot = slot;
                this.x = s.x; this.y = s.y;
                this.angle = slot % 2 === 0 ? 0 : Math.PI;
                this.color = PLAYER_COLORS[slot];
                this.bullets = [];
                this.lastShot = 0;
                this.alive = true;
                this.radius = TANK_SIZE / 2;
            }
            reset() {
                const s = SPAWNS[this.slot];
                this.x = s.x; this.y = s.y;
                this.angle = this.slot % 2 === 0 ? 0 : Math.PI;
                this.bullets = [];
                this.lastShot = 0;
                this.alive = true;
            }
            update(inputs, others) {
                if (!this.alive || gameOver || matchOver) return;
                if (inputs.left) this.angle -= ROT_SPEED;
                if (inputs.right) this.angle += ROT_SPEED;
                let moveX = 0, moveY = 0;
                if (inputs.up) {
                    moveX = Math.cos(this.angle) * TANK_SPEED;
                    moveY = Math.sin(this.angle) * TANK_SPEED;
                }
                if (inputs.down) {
                    moveX = -Math.cos(this.angle) * TANK_SPEED * 0.7;
                    moveY = -Math.sin(this.angle) * TANK_SPEED * 0.7;
                }
                const nx = this.x + moveX, ny = this.y + moveY;
                if (!this.hitsWall(nx, ny) && !this.hitsTank(nx, ny, others)) {
                    this.x = nx; this.y = ny;
                } else if (!this.hitsWall(this.x + moveX, this.y) && !this.hitsTank(this.x + moveX, this.y, others)) {
                    this.x += moveX;
                } else if (!this.hitsWall(this.x, this.y + moveY) && !this.hitsTank(this.x, this.y + moveY, others)) {
                    this.y += moveY;
                }
                const cooldown = this.isBot ? BOT_FIRE_COOLDOWN : FIRE_COOLDOWN;
                if (inputs.shoot && Date.now() - this.lastShot > cooldown) {
                    this.shoot();
                    this.lastShot = Date.now();
                }
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    b.x += Math.cos(b.angle) * BULLET_SPEED;
                    b.y += Math.sin(b.angle) * BULLET_SPEED;
                    if (this.bulletHitsWall(b) || b.x < 0 || b.x > 800 || b.y < 0 || b.y > 500) {
                        this.bullets.splice(i, 1);
                    }
                }
            }
            shoot() {
                this.bullets.push({
                    x: this.x + Math.cos(this.angle) * (this.radius + 6),
                    y: this.y + Math.sin(this.angle) * (this.radius + 6),
                    angle: this.angle
                });
                if (shotsFired[this.slot] !== undefined) shotsFired[this.slot]++;
                playPew();
            }
            hitsWall(nx, ny) {
                return circleHitsWall(nx, ny, this.radius);
            }
            hitsTank(nx, ny, others) {
                for (const o of others) {
                    if (!o || !o.alive || o.slot === this.slot) continue;
                    if (Math.hypot(nx - o.x, ny - o.y) < this.radius + o.radius - 2) return true;
                }
                return false;
            }
            bulletHitsWall(b) {
                // Destructible: punch a hole, then remove the bullet
                if (circleHitsWall(b.x, b.y, BULLET_RADIUS)) {
                    destroyWallAt(b.x, b.y, CELL * 0.85);
                    return true;
                }
                return false;
            }
            // returns slot of player hit, or -1
            checkHits(others) {
                if (!this.alive) return -1;
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    for (const o of others) {
                        if (!o || !o.alive || o.slot === this.slot) continue;
                        if (Math.hypot(b.x - o.x, b.y - o.y) < o.radius + BULLET_RADIUS) {
                            o.alive = false;
                            this.bullets.splice(i, 1);
                            if (hitsLanded[this.slot] !== undefined) hitsLanded[this.slot]++;
                            playExplosion();
                            return o.slot;
                        }
                    }
                }
                return -1;
            }
            draw() {
                if (!this.alive) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-TANK_SIZE/2, -TANK_SIZE/2, TANK_SIZE, TANK_SIZE);
                    ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
                    ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
                    ctx.stroke();
                    ctx.restore();
                    return;
                }
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.fillRect(-TANK_SIZE/2, -TANK_SIZE/2, TANK_SIZE, TANK_SIZE);
                ctx.fillStyle = '#222';
                ctx.fillRect(-TANK_SIZE/2 - 3, -TANK_SIZE/2, 4, TANK_SIZE);
                ctx.fillRect(TANK_SIZE/2 - 1, -TANK_SIZE/2, 4, TANK_SIZE);
                ctx.fillStyle = '#111';
                ctx.fillRect(6, -3, 16, 6);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(-TANK_SIZE/2 + 2, -TANK_SIZE/2 + 2, TANK_SIZE - 8, 6);
                ctx.restore();
                for (const b of this.bullets) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, BULLET_RADIUS + 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color + '55';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }
            toState() {
                return {
                    slot: this.slot, x: this.x, y: this.y, angle: this.angle,
                    alive: this.alive,
                    bullets: this.bullets.map(b => ({ x: b.x, y: b.y, angle: b.angle }))
                };
            }
            fromState(s) {
                this.x = s.x; this.y = s.y; this.angle = s.angle;
                this.alive = s.alive;
                this.bullets = s.bullets || [];
            }
        }

        // ==================== TOUCH JOYSTICK ====================
        const shootBtn = document.getElementById('shootBtn');

        const joystickStick = document.getElementById('joystickStick');
        let joyTouchId = null, shootTouchId = null, mouseJoy = false;

        function detectTouchDevice() {
            isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            return isTouchDevice;
        }
        function updateTouchControlsVisibility() {
            if (mode && gameStarted && (isTouchDevice || window.innerWidth < 700)) {

        function handleJoystick(clientX, clientY) {
            const rect = joystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            let dx = clientX - cx, dy = clientY - cy;
            const maxDist = rect.width / 2 - 10;
            const dist = Math.hypot(dx, dy);
            if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
            joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickStick.classList.add('active');
            const dead = 12;
            const nx = dist > dead ? dx / maxDist : 0;
            const ny = dist > dead ? dy / maxDist : 0;
            touchInput.left = touchInput.right = touchInput.up = touchInput.down = false;
            if (dist > dead) {
                if (nx < -0.3) touchInput.left = true;
                if (nx > 0.3) touchInput.right = true;
                if (ny < -0.25) touchInput.up = true;
                if (ny > 0.4) touchInput.down = true;
            }
        }
        function resetTouchDirs() {
            joystickStick.style.transform = 'translate(-50%, -50%)';

        }, { passive: false });
        joystickZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) { handleJoystick(t.clientX, t.clientY); break; }
            }
        }, { passive: false });
        function endJoy(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) { resetTouchDirs(); break; }

        joystickZone.addEventListener('touchend', endJoy, { passive: false });

        // ==================== BOT AI ====================
        // slots[i].isBot = true for AI-controlled tanks
        function getBotInputs(botTank, others) {
            const inputs = emptyInputs();
            if (!botTank.alive) return inputs;

            // Nearest living enemy
            let target = null, best = Infinity;
            for (const o of others) {
                if (!o || !o.alive || o.slot === botTank.slot) continue;
                const d = Math.hypot(o.x - botTank.x, o.y - botTank.y);
                if (d < best) { best = d; target = o; }
            }
            if (!target) return inputs;

            const desired = Math.atan2(target.y - botTank.y, target.x - botTank.x);
            let diff = desired - botTank.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;

            // Turn toward target
            if (diff > 0.12) inputs.right = true;
            else if (diff < -0.12) inputs.left = true;

            // Drive forward when roughly facing target
            if (Math.abs(diff) < 0.55) inputs.up = true;

            // Back up if very close (avoid bumping)
            if (best < 55 && Math.abs(diff) > 0.9) {
                inputs.up = false;
                inputs.down = true;
            }

            // Shoot when aimed well enough
            if (Math.abs(diff) < 0.28 && best < 420) inputs.shoot = true;

            // Slight randomness so bots aren't perfect
            if (Math.random() < 0.02) inputs.left = !inputs.left;
            if (Math.random() < 0.02) inputs.right = !inputs.right;
            if (Math.random() < 0.08) inputs.shoot = false;

            return inputs;
        }

        // ==================== NETWORK ====================
        const GAME_BASE_URL = 'https://joecool805.github.io/tank/tank_game.html';
        const PEER_OPTS = {
            host: '0.peerjs.com', port: 443, path: '/', secure: true, debug: 1,
            config: { iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]}
        };
        const ROOM_CODE_LOCK_MS = 300000;
        const ROOM_STORAGE_KEY = 'tank_battle_room_v1';
        let currentRoomCode = null;
        let hostRecreating = false;
        let hostSameCodeAttempts = 0;
        let hostKeepAliveTimer = null;
        let joinRetryCount = 0;
        const MAX_JOIN_RETRIES = 20;

        function getShareLink(code) { return GAME_BASE_URL + '?room=' + encodeURIComponent(code); }
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }
        function saveRoomToStorage(code) {
            try { localStorage.setItem(ROOM_STORAGE_KEY, JSON.stringify({ code, until: Date.now() + ROOM_CODE_LOCK_MS })); } catch (e) {}
        }
        function loadRoomFromStorage() {
            try {
                const data = JSON.parse(localStorage.getItem(ROOM_STORAGE_KEY) || 'null');
                if (data && data.code && data.until > Date.now()) return String(data.code).toUpperCase();
                localStorage.removeItem(ROOM_STORAGE_KEY);
            } catch (e) {}
            return null;
        }
        function clearRoomStorage() { try { localStorage.removeItem(ROOM_STORAGE_KEY); } catch (e) {} }
        function lockRoomCode(code) {
            currentRoomCode = String(code).toUpperCase();
            saveRoomToStorage(currentRoomCode);
        }
        function clearHostKeepAlive() {
            if (hostKeepAliveTimer) { clearInterval(hostKeepAliveTimer); hostKeepAliveTimer = null; }
        }
        function startHostKeepAlive() {
            clearHostKeepAlive();
            hostKeepAliveTimer = setInterval(() => {
                if (mode !== 'host') { clearHostKeepAlive(); return; }
                if (peer && !peer.destroyed && peer.disconnected) {
                    try { peer.reconnect(); } catch (e) {}
                }
                if (!gameStarted) updatePlayerCountUI();
            }, 4000);
        }
        function destroyPeer(keepRoomCode) {
            clearHostKeepAlive();
            // Close all slot connections
            if (slots) {
                for (const s of slots) {
                    if (s.conn) { try { s.conn.close(); } catch (e) {} s.conn = null; }
                }
            }
            if (clientConn) { try { clientConn.close(); } catch (e) {} clientConn = null; }
            if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
            if (!keepRoomCode) { currentRoomCode = null; clearRoomStorage(); }
        }

        function resolveHostCode(preferred) {
            if (preferred) return String(preferred).toUpperCase();
            if (currentRoomCode) return currentRoomCode;
            const stored = loadRoomFromStorage();
            if (stored) return stored;
            return generateRoomCode();
        }

        function setupHost(preferredCode) {
            const code = resolveHostCode(preferredCode);
            if (peer && !peer.destroyed && peer.id === code && peer.disconnected) {
                try { peer.reconnect(); return; } catch (e) {}
            }
            destroyPeer(true);
            hostRecreating = false;
            lockRoomCode(code);
            initSlots();
            // Host occupies slot 0
            slots[0].active = true;
            slots[0].peerId = 'host';
            slots[0].tank = new Tank(0);
            gameStarted = false;
            mySlot = 0;

            document.getElementById('roomCodeDisplay').textContent = code;
            document.getElementById('hostStatus').textContent = 'Opening room ' + code + '...';
            document.getElementById('hostStatus').className = 'status';
            updatePlayerCountUI();

            peer = new Peer(code, PEER_OPTS);

            peer.on('open', id => {
                lockRoomCode(id);
                hostSameCodeAttempts = 0;
                document.getElementById('roomCodeDisplay').textContent = id;
                document.getElementById('hostStatus').textContent = 'Waiting for players... (need 2 to start)';
                document.getElementById('hostStatus').className = 'status success';
                startHostKeepAlive();
            });

            peer.on('connection', connection => {
                handleIncomingConnection(connection);
            });

            peer.on('disconnected', () => {
                if (mode === 'host' && peer && !peer.destroyed) {
                    document.getElementById('hostStatus').textContent = 'Connection lost — reconnecting to ' + (currentRoomCode || code) + '...';
                    document.getElementById('hostStatus').className = 'status error';
                    setTimeout(() => {
                        if (mode === 'host' && peer && !peer.destroyed) {
                            try { peer.reconnect(); } catch (e) { scheduleHostRecreate(3000); }
                        }
                    }, 500);
                }
            });

            peer.on('error', err => {
                console.error('Host error', err.type, err);
                hostSameCodeAttempts++;
                const label = currentRoomCode || code;
                document.getElementById('hostStatus').textContent =
                    (err.type === 'unavailable-id' ? 'Room busy, retrying ' : 'Network issue, restoring ') + label + '...';
                document.getElementById('hostStatus').className = 'status error';
                scheduleHostRecreate(err.type === 'unavailable-id' ? 3000 : 2000);
            });
        }

        function handleIncomingConnection(connection) {
            connection.on('open', () => {
                const slot = firstFreeSlot();
                if (slot < 0) {
                    connection.send({ type: 'full' });
                    connection.close();
                    return;
                }
                slots[slot].active = true;
                slots[slot].peerId = connection.peer;
                slots[slot].conn = connection;
                slots[slot].inputs = emptyInputs();
                slots[slot].tank = new Tank(slot);
                // If joining mid-game, keep them alive for current round
                if (gameStarted && !matchOver) {
                    slots[slot].tank.reset();
                }
                updatePlayerCountUI();
                updateScoreBoard();

                connection.send({
                    type: 'welcome',
                    slot: slot,
                    gameStarted: gameStarted,
                    scores: scores,
                    currentRound: currentRound,
                    matchOver: matchOver,
                    activeSlots: slots.map(s => s.active),
                    walls: packWallGrid()
                });

                connection.on('data', data => {
                    if (data.type === 'input' && slots[slot]) {
                        slots[slot].inputs = data.inputs || emptyInputs();
                    }
                });
                connection.on('close', () => {
                    if (slots[slot] && slots[slot].conn === connection) {
                        slots[slot].active = false;
                        slots[slot].conn = null;
                        slots[slot].peerId = null;
                        updatePlayerCountUI();
                        updateScoreBoard();
                        if (gameStarted) broadcastState(true);
                    }
                });

                document.getElementById('hostStatus').textContent =
                    'Players: ' + countActive() + '/4' + (gameStarted ? ' (in game)' : ' — starting soon...');
                document.getElementById('hostStatus').className = 'status success';

        }

        function beginOnlineGame() {
            if (gameStarted || mode !== 'host') return;
            gameStarted = true;
            scores = [0, 0, 0, 0];

        function scheduleHostRecreate(delayMs) {
            if (hostRecreating || mode !== 'host') return;
            hostRecreating = true;
            setTimeout(() => {
                hostRecreating = false;
                if (mode !== 'host') return;
                setupHost(currentRoomCode || loadRoomFromStorage());
            }, delayMs || 2000);
        }

        function restoreHostIfNeeded() {
            if (mode !== 'host') return;
            const code = currentRoomCode || loadRoomFromStorage();
            if (peer && !peer.destroyed) {
                if (peer.disconnected) {
                    try { peer.reconnect(); } catch (e) { scheduleHostRecreate(500); }
                }
                return;
            }
            if (!gameStarted) scheduleHostRecreate(400);
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') restoreHostIfNeeded();
        });
        window.addEventListener('focus', restoreHostIfNeeded);
        window.addEventListener('pageshow', restoreHostIfNeeded);

        async function copyShareLink() {
            const code = currentRoomCode || document.getElementById('roomCodeDisplay').textContent;
            if (!code || code === '----') {
                document.getElementById('shareStatus').textContent = 'Room not ready yet';
                document.getElementById('shareStatus').className = 'status error';
                return;
            }
            lockRoomCode(code);
            if (peer && peer.disconnected) {
                try { peer.reconnect(); } catch (e) { scheduleHostRecreate(500); }
            }
            const link = getShareLink(code);
            const statusEl = document.getElementById('shareStatus');
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(link);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = link; ta.style.position = 'fixed'; ta.style.left = '-9999px';
                    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                statusEl.textContent = 'Link copied for room ' + code + '. Come back after sending.';
                statusEl.className = 'status success';
            } catch (e) {
                statusEl.textContent = link;
                statusEl.className = 'status success';
            }
        }

        function setupJoin(code, isRetry) {
            if (!isRetry) joinRetryCount = 0;
            code = (code || '').toUpperCase();
            document.getElementById('joinStatus').textContent =
                joinRetryCount > 0
                    ? 'Host not found, retrying (' + joinRetryCount + '/' + MAX_JOIN_RETRIES + ')...'
                    : 'Connecting to ' + code + '...';
            document.getElementById('joinStatus').className = 'status';
            destroyPeer(false);
            peer = new Peer(PEER_OPTS);
            peer.on('open', () => {
                clientConn = peer.connect(code, { reliable: true, serialization: 'json' });
                clientConn.on('error', () => retryJoin(code));
                clientConn.on('open', () => {
                    document.getElementById('joinStatus').textContent = 'Connected! Waiting for slot...';
                    document.getElementById('joinStatus').className = 'status success';
                });
                clientConn.on('data', data => handleClientData(data));
                clientConn.on('close', () => {
                    showMessage('Disconnected from host');
                    setTimeout(() => leaveGame(), 2000);
                });
                setTimeout(() => { if (mode === 'client' && !gameStarted && mySlot === 0 && !slots[0]?.active) retryJoin(code); }, 5000);
            });
            peer.on('error', err => {
                if (err.type === 'peer-unavailable' || err.type === 'network' || err.type === 'server-error') retryJoin(code);
                else {
                    document.getElementById('joinStatus').textContent = 'Error: ' + (err.type || err.message);
                    document.getElementById('joinStatus').className = 'status error';
                }
            });
        }

        function retryJoin(code) {
            if (mode !== 'client' || gameStarted) return;
            joinRetryCount++;
            if (joinRetryCount > MAX_JOIN_RETRIES) {
                document.getElementById('joinStatus').textContent =
                    'Could not find host. Ask them to return to the game tab, then reload this link.';
                document.getElementById('joinStatus').className = 'status error';
                destroyPeer(false);
                return;
            }
            setTimeout(() => { if (mode === 'client' && !gameStarted) setupJoin(code, true); }, 2500);
        }

        function handleClientData(data) {
            if (data.type === 'full') {
                document.getElementById('joinStatus').textContent = 'Room is full (4/4)';
                document.getElementById('joinStatus').className = 'status error';
                return;
            }
            if (data.type === 'welcome') {
                mySlot = data.slot;
                scores = data.scores || [0, 0, 0, 0];
                currentRound = data.currentRound || 1;
                matchOver = !!data.matchOver;
                if (data.walls) unpackWallGrid(data.walls);
                initSlots();
                if (data.activeSlots) {
                    data.activeSlots.forEach((a, i) => { if (slots[i]) slots[i].active = !!a; });
                }
                slots[mySlot].active = true;
                if (data.gameStarted) {
                    gameStarted = true;
                    showGameUI('client');
                } else {
                    document.getElementById('joinStatus').textContent =
                        'You are ' + PLAYER_NAMES[mySlot] + ' — waiting for game to start...';
                    document.getElementById('joinStatus').className = 'status success';
                }
            }
            if (data.type === 'state') {
                if (!gameStarted) {
                    gameStarted = true;
                    showGameUI('client');
                }
                applyHostState(data);
            }
            if (data.type === 'playAgain') {
                startNewMatch(false);
            }
        }

        function applyHostState(data) {
            scores = data.scores || scores;
            if (data.shotsFired) shotsFired = data.shotsFired;
            if (data.hitsLanded) hitsLanded = data.hitsLanded;
            currentRound = data.currentRound || currentRound;
            gameOver = !!data.gameOver;
            matchOver = !!data.matchOver;
            if (data.walls) unpackWallGrid(data.walls);
            if (data.activeSlots) {
                data.activeSlots.forEach((a, i) => {
                    if (!slots[i]) return;
                    slots[i].active = !!a;
                    if (a && !slots[i].tank) slots[i].tank = new Tank(i);
                });
            }
            if (data.tanks) {
                for (const ts of data.tanks) {
                    if (!slots[ts.slot]) continue;
                    if (!slots[ts.slot].tank) slots[ts.slot].tank = new Tank(ts.slot);
                    slots[ts.slot].active = true;
                    slots[ts.slot].tank.fromState(ts);
                }
            }
            // Play sounds sent by host (clients don't simulate shots/hits)
            if (data.sfx && data.sfx.length) playSfxList(data.sfx);
            updateScoreBoard();
            updateRoundLabel();
            if (matchOver) {
                const winner = data.matchWinner;
                if (winner != null) showMatchOver(winner);
            } else if (data.roundWinner != null && gameOver) {
                showMessage(PLAYER_NAMES[data.roundWinner] + ' wins the round!');
            } else if (!gameOver) {
                messageEl.classList.remove('show');
            }
            if (data.matchOver === false && document.getElementById('matchOverlay').style.display !== 'none') {
                hideMatchOverlay();
            }
        }

        function broadcastState(force) {
            if (mode !== 'host') return;
            const now = Date.now();
            if (!force && now - lastNetworkSend < TICK_RATE) return;
            lastNetworkSend = now;

            const tanks = activeSlots().map(s => s.tank.toState());
            let roundWinner = null;
            if (gameOver && !matchOver) {
                const alive = activeTanks().filter(t => t.alive);
                if (alive.length === 1) roundWinner = alive[0].slot;
            }
            let matchWinner = null;
            if (matchOver) {
                let best = -1, bestSlot = 0;
                for (let i = 0; i < MAX_PLAYERS; i++) {
                    if (scores[i] > best) { best = scores[i]; bestSlot = i; }
                }
                matchWinner = bestSlot;
            }

            const sfx = pendingSfx.slice();
            pendingSfx = [];

            const payload = {
                type: 'state',
                tanks,
                scores,
                shotsFired,
                hitsLanded,
                currentRound,
                gameOver,
                matchOver,
                roundWinner,
                matchWinner,
                activeSlots: slots.map(s => s.active),
                sfx,
                walls: packWallGrid()
            };
            for (const s of slots) {
                if (s.conn && s.conn.open) {
                    try { s.conn.send(payload); } catch (e) {}
                }
            }
        }

        function sendClientInputs() {
            if (mode !== 'client' || !clientConn || !clientConn.open) return;
            const now = Date.now();
            if (now - lastNetworkSend < TICK_RATE) return;
            lastNetworkSend = now;
            try {
                clientConn.send({ type: 'input', inputs: getMergedInputs() });
            } catch (e) {}
        }

        // ==================== GAME FLOW ====================
        function showMenu() {
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('gameUI').style.display = 'none';
            document.getElementById('hostPanel').style.display = 'none';
            document.getElementById('joinPanel').style.display = 'none';
            document.getElementById('practicePanel').style.display = 'none';
            document.getElementById('btnPractice').style.display = 'block';
            document.getElementById('btnLocal').style.display = 'block';
            document.getElementById('btnHost').style.display = 'block';
            document.getElementById('btnJoin').style.display = 'block';
            touchControls.classList.remove('active');
            hideMatchOverlay();
            if (roundTransitionTimer) { clearTimeout(roundTransitionTimer); roundTransitionTimer = null; }
        }

        function showGameUI(m) {
            mode = m;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameUI').style.display = 'flex';
            disconnectBtn.style.display = (mode === 'host' || mode === 'client') ? 'block' : 'none';
            if (mode === 'local') {
                modeLabel.textContent = 'Local';
                controlsInfo.innerHTML = '<div><strong>P1 Blue</strong><br>WASD + SPACE</div><div><strong>P2 Red</strong><br>Arrows + ENTER</div>';
            } else if (mode === 'practice') {
                modeLabel.textContent = 'Practice';
                controlsInfo.innerHTML = '<div><strong>You are P1 Blue</strong><br>WASD / Arrows / Joystick + FIRE</div><div><strong>Bots</strong><br>AI controlled</div>';
            } else {
                modeLabel.textContent = 'Online — You: ' + PLAYER_NAMES[mySlot];
                controlsInfo.innerHTML = '<div><strong>You are ' + PLAYER_NAMES[mySlot] + '</strong><br>WASD / Arrows / Joystick + FIRE</div>';
            }
            restartHint.textContent = 'Best of 3 — last tank standing wins the round';
            updateScoreBoard();
            updateRoundLabel();
            updateTouchControlsVisibility();
            resizeCanvas();
        }

        function startLocalGame() {
            mode = 'local';
            gameStarted = true;
            initSlots();
            slots[0].active = true;
            slots[0].isBot = false;
            slots[1].active = true;
            slots[1].isBot = false;
            mySlot = 0;
            startNewMatch(false);
            showGameUI('local');
        }

        function startPracticeGame(botCount) {
            mode = 'practice';
            gameStarted = true;
            initSlots();
            slots[0].active = true;
            slots[0].isBot = false;
            if (slots[0].tank) slots[0].tank.isBot = false;
            mySlot = 0;
            const n = Math.max(1, Math.min(3, botCount | 0));
            for (let i = 1; i <= n; i++) {
                slots[i].active = true;
                slots[i].isBot = true;
                if (slots[i].tank) slots[i].tank.isBot = true;
            }
            startNewMatch(false);
            showGameUI('practice');
        }

        function startNewMatch(send) {
            if (roundTransitionTimer) { clearTimeout(roundTransitionTimer); roundTransitionTimer = null; }
            scores = [0, 0, 0, 0];
            shotsFired = [0, 0, 0, 0];
            hitsLanded = [0, 0, 0, 0];
            currentRound = 1;
            gameOver = false;
            matchOver = false;
            hideMatchOverlay();
            messageEl.classList.remove('show');
            resetTouchDirs();
            touchInput.shoot = false;
            // New random map each match (keep holes during rounds of same match)
            if (mode !== 'client') generateWalls();
            for (const s of slots) if (s.active) s.tank.reset();
            updateScoreBoard();
            updateRoundLabel();
            if (mode === 'host' && send) {
                for (const s of slots) {
                    if (s.conn && s.conn.open) {
                        try { s.conn.send({ type: 'playAgain' }); } catch (e) {}
                    }
                }
                broadcastState(true);
            }
        }

        function resetRound() {
            if (matchOver) return;
            if (roundTransitionTimer) { clearTimeout(roundTransitionTimer); roundTransitionTimer = null; }
            gameOver = false;
            messageEl.classList.remove('show');
            for (const s of slots) if (s.active) s.tank.reset();
            updateRoundLabel();
            if (mode === 'host') broadcastState(true);
        }

        function onRoundWin(winnerSlot) {
            if (gameOver || matchOver) return;
            gameOver = true;
            scores[winnerSlot]++;
            updateScoreBoard();
            showMessage(PLAYER_NAMES[winnerSlot] + ' wins the round!');

            if (scores[winnerSlot] >= 2) {
                matchOver = true;
                setTimeout(() => showMatchOver(winnerSlot), 1200);
            } else {
                currentRound++;
                if (mode === 'local' || mode === 'practice' || mode === 'host') {
                    roundTransitionTimer = setTimeout(() => resetRound(), 2200);
                }
            }
            if (mode === 'host') broadcastState(true);
        }

        function checkRoundEnd() {
            if (gameOver || matchOver || !gameStarted) return;
            const alive = activeTanks().filter(t => t.alive);
            if (alive.length === 1 && countActive() >= 2) {
                onRoundWin(alive[0].slot);
            }
        }

        function formatMatchStats() {
            const lines = [];
            for (let i = 0; i < MAX_PLAYERS; i++) {
                const participated = (slots[i] && slots[i].active) || scores[i] > 0 || shotsFired[i] > 0;
                if (!participated) continue;
                const shots = shotsFired[i] || 0;
                const hits = hitsLanded[i] || 0;
                const acc = shots > 0 ? Math.round((hits / shots) * 100) : 0;
                lines.push(
                    PLAYER_NAMES[i] + ':  ' + shots + ' shots  ·  ' + hits + ' hits  ·  ' + acc + '% accuracy'
                );
            }
            return lines.join('\n');
        }

        function showMatchOver(winnerSlot) {
            matchOver = true;
            gameOver = true;
            messageEl.classList.remove('show');
            document.getElementById('matchResultText').textContent = PLAYER_NAMES[winnerSlot] + ' WINS THE MATCH!';
            document.getElementById('matchScoreText').textContent =
                scores.map((s, i) => (slots[i] && slots[i].active) || s > 0 ? PLAYER_NAMES[i] + ': ' + s : null)
                    .filter(Boolean).join('  ·  ');
            const statsEl = document.getElementById('matchStatsText');
            if (statsEl) {
                statsEl.textContent = formatMatchStats();
                statsEl.style.whiteSpace = 'pre-line';
            }
            document.getElementById('matchOverlay').style.display = 'flex';
            const playBtn = document.getElementById('btnPlayAgain');
            if (mode === 'client') {
                playBtn.textContent = 'Waiting for host...';
                playBtn.disabled = true;
            } else {
                playBtn.textContent = 'Play Again';
                playBtn.disabled = false;
                playBtn.style.opacity = '1';
            }
        }
        function hideMatchOverlay() {
            document.getElementById('matchOverlay').style.display = 'none';
            const playBtn = document.getElementById('btnPlayAgain');
            playBtn.disabled = false;
            playBtn.textContent = 'Play Again';
        }

        function leaveGame() {
            if (roundTransitionTimer) { clearTimeout(roundTransitionTimer); roundTransitionTimer = null; }
            destroyPeer(false);
            mode = null;
            gameStarted = false;
            matchOver = false;
            hideMatchOverlay();
            showMenu();
        }

        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.classList.add('show');
        }

        function resizeCanvas() {
            const wrap = document.querySelector('.canvas-wrap');
            if (!wrap) return;
            const scale = Math.min((wrap.clientWidth - 8) / 800, (wrap.clientHeight - 8) / 500, 1);
            canvas.style.width = (800 * scale) + 'px';
            canvas.style.height = (500 * scale) + 'px';
        }
        window.addEventListener('resize', () => { resizeCanvas(); updateTouchControlsVisibility(); });
        window.addEventListener('orientationchange', () => setTimeout(() => { resizeCanvas(); updateTouchControlsVisibility(); }, 200));

        function drawWorld() {
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, 800, 500);
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < 800; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 500); ctx.stroke(); }
            for (let y = 0; y < 500; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke(); }
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!wallGrid[r] || !wallGrid[r][c]) continue;
                    const x = c * CELL, y = r * CELL;
                    const isBorder = r < BORDER || r >= ROWS - BORDER || c < BORDER || c >= COLS - BORDER;
                    ctx.fillStyle = isBorder ? '#1e1e3a' : '#2a2a4a';
                    ctx.fillRect(x, y, CELL, CELL);
                    if (!isBorder) {
                        ctx.strokeStyle = '#3a3a6a';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
                    }
                }
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (!mode || !gameStarted) return;

            drawWorld();

            if (mode === 'local') {
                const tanks = activeTanks();
                slots[0].tank.update(getLocalP1Inputs(), tanks);
                slots[1].tank.update(getLocalP2Inputs(), tanks);
                for (const t of tanks) t.checkHits(tanks);
                checkRoundEnd();
            } else if (mode === 'practice') {
                const tanks = activeTanks();
                slots[0].tank.update(getMergedInputs(), tanks);
                for (const s of activeSlots()) {
                    if (s.isBot) s.tank.update(getBotInputs(s.tank, tanks), tanks);
                }
                for (const t of tanks) t.checkHits(tanks);
                checkRoundEnd();
            } else if (mode === 'host') {
                slots[0].inputs = getMergedInputs();
                const tanks = activeTanks();
                for (const s of activeSlots()) {
                    s.tank.update(s.inputs, tanks);
                }
                for (const s of activeSlots()) s.tank.checkHits(tanks);
                checkRoundEnd();
                broadcastState(false);
            } else if (mode === 'client') {
                sendClientInputs();
            }

            for (const s of slots) {
                if (s.active && s.tank) s.tank.draw();
            }
        }

        // ==================== UI ====================
        document.getElementById('btnPractice').onclick = () => {
            document.getElementById('btnPractice').style.display = 'none';
            document.getElementById('btnLocal').style.display = 'none';
            document.getElementById('btnHost').style.display = 'none';
            document.getElementById('btnJoin').style.display = 'none';
            document.getElementById('practicePanel').style.display = 'block';
        };
        document.getElementById('btnBots1').onclick = () => startPracticeGame(1);
        document.getElementById('btnBots2').onclick = () => startPracticeGame(2);
        document.getElementById('btnBots3').onclick = () => startPracticeGame(3);
        document.getElementById('btnCancelPractice').onclick = () => showMenu();
        document.getElementById('btnLocal').onclick = () => startLocalGame();
        document.getElementById('btnHost').onclick = () => {
            document.getElementById('btnPractice').style.display = 'none';
            document.getElementById('btnLocal').style.display = 'none';
            document.getElementById('btnHost').style.display = 'none';
            document.getElementById('btnJoin').style.display = 'none';
            document.getElementById('hostPanel').style.display = 'block';
            mode = 'host';
            setupHost();
        };
        document.getElementById('btnJoin').onclick = () => {
            document.getElementById('btnPractice').style.display = 'none';
            document.getElementById('btnLocal').style.display = 'none';
            document.getElementById('btnHost').style.display = 'none';
            document.getElementById('btnJoin').style.display = 'none';
            document.getElementById('joinPanel').style.display = 'block';
        };
        document.getElementById('btnCancelHost').onclick = () => {
            mode = null; gameStarted = false;
            destroyPeer(false);
            showMenu();
        };
        document.getElementById('btnCancelJoin').onclick = () => {
            mode = null; gameStarted = false;
            destroyPeer(false);
            showMenu();
        };
        document.getElementById('btnDoJoin').onclick = () => {
            const code = document.getElementById('joinCode').value.trim().toUpperCase();
            if (code.length < 4) {
                document.getElementById('joinStatus').textContent = 'Enter a valid room code';
                document.getElementById('joinStatus').className = 'status error';
                return;
            }
            mode = 'client';
            setupJoin(code);
        };
        document.getElementById('joinCode').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('btnDoJoin').click();
        });
        document.getElementById('btnShareLink').onclick = () => copyShareLink();
        disconnectBtn.onclick = leaveGame;
        document.getElementById('btnPlayAgain').onclick = () => {
            if (mode === 'client') return;
            startNewMatch(mode === 'host');
        };
        document.getElementById('btnMatchMenu').onclick = leaveGame;

        function tryAutoJoinFromUrl() {
            try {
                const room = (new URLSearchParams(window.location.search).get('room') || '').trim().toUpperCase();
                if (room.length >= 4) {
                    document.getElementById('btnPractice').style.display = 'none';
                    document.getElementById('btnLocal').style.display = 'none';
                    document.getElementById('btnHost').style.display = 'none';
                    document.getElementById('btnJoin').style.display = 'none';
                    document.getElementById('joinPanel').style.display = 'block';
                    document.getElementById('joinCode').value = room;
                    mode = 'client';
                    setupJoin(room);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        detectTouchDevice();
        gameLoop();
        showMenu();
        tryAutoJoinFromUrl();
    </script>
</body>
</html>
